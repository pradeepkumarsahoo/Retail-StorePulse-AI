<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="t2 d2">
<title id="t2">StorePulse-AI agentic loop</title>
<desc id="d2">A supervisor dispatches to six specialist agents (including the Inbound Logistics Planner that reads the TMS 5-day truck outlook) that can only reach data through the typed tool gateway. Results are schema-validated and routed through human review. Everything is audited.</desc>
<defs>
  <marker id="arr2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#7b86a3"/>
  </marker>
  <style>
    .bg { fill: #ffffff; }
    .user { fill: #ecfeff; stroke: #06b6d4; }
    .ai   { fill: #f5f3ff; stroke: #8b5cf6; }
    .node { fill: #f8fafc; stroke: #cbd5e1; }
    .data { fill: #fffbeb; stroke: #f59e0b; }
    .gate { fill: #f5f3ff; stroke: #8b5cf6; stroke-dasharray: 4 3; }
    .title { font: 600 13px "Inter", system-ui, sans-serif; fill: #0b1220; }
    .label { font: 400 11px "Inter", system-ui, sans-serif; fill: #475569; }
    .tag   { font: 600 9.5px "JetBrains Mono", ui-monospace, monospace; fill: #64748b;
             letter-spacing: 0.1em; text-transform: uppercase; }
    .arrow { stroke: #7b86a3; stroke-width: 1.4; fill: none; opacity: 0.75; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #070914; }
      .user { fill: rgba(34,211,238,0.12); stroke: #06b6d4; }
      .ai   { fill: rgba(139,92,246,0.14); stroke: #8b5cf6; }
      .node { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.16); }
      .data { fill: rgba(245,158,11,0.12); stroke: #f59e0b; }
      .gate { fill: rgba(139,92,246,0.14); stroke: #8b5cf6; }
      .title { fill: #e8ecf5; }
      .label { fill: #b7c0d4; }
      .tag   { fill: #7b86a3; }
    }
  </style>
</defs>
<rect class="bg" width="960" height="540"/>

<g transform="translate(20,20)">
  <rect class="user" x="0" y="0" width="190" height="56" rx="10"/>
  <text class="title" x="14" y="24">User request</text>
  <text class="label" x="14" y="42">"Investigate Store S001"</text>
</g>
<path class="arrow" d="M210 48L245 48" marker-end="url(#arr2)"/>

<g transform="translate(250,20)">
  <rect class="node" x="0" y="0" width="150" height="56" rx="10"/>
  <text class="title" x="14" y="24">AuthN · AuthZ</text>
  <text class="label" x="14" y="42">Role · scope · policy</text>
</g>
<path class="arrow" d="M400 48L435 48" marker-end="url(#arr2)"/>

<g transform="translate(440,10)">
  <rect class="ai" x="0" y="0" width="190" height="76" rx="10"/>
  <text class="tag" x="14" y="20" fill="#8b5cf6">Supervisor</text>
  <text class="title" x="14" y="40">Classify &amp; bound</text>
  <text class="label" x="14" y="58">step budget · token budget</text>
  <text class="label" x="14" y="70">timeout · prompt version</text>
</g>
<path class="arrow" d="M535 86L535 118" marker-end="url(#arr2)"/>

<!-- Specialists row (6) -->
<g transform="translate(20,128)">
  <rect class="ai" x="0" y="0" width="145" height="70" rx="10"/>
  <text class="tag" x="10" y="20" fill="#8b5cf6">Specialist</text>
  <text class="title" x="10" y="40">Store Performance</text>
  <text class="label" x="10" y="58">KPI set · comparables</text>
</g>
<g transform="translate(173,128)">
  <rect class="ai" x="0" y="0" width="150" height="70" rx="10"/>
  <text class="tag" x="10" y="20" fill="#8b5cf6">Specialist</text>
  <text class="title" x="10" y="40">Workforce Analyst</text>
  <text class="label" x="10" y="58">Forecast · rate · TMS check</text>
</g>
<g transform="translate(331,128)">
  <rect class="ai" x="0" y="0" width="160" height="70" rx="10"/>
  <text class="tag" x="10" y="20" fill="#8b5cf6">Specialist · new</text>
  <text class="title" x="10" y="40">Inbound Logistics</text>
  <text class="label" x="10" y="58">TMS 5-day trucks · plan</text>
</g>
<g transform="translate(499,128)">
  <rect class="ai" x="0" y="0" width="150" height="70" rx="10"/>
  <text class="tag" x="10" y="20" fill="#8b5cf6">Specialist</text>
  <text class="title" x="10" y="40">Anomaly Investigator</text>
  <text class="label" x="10" y="58">Evidence · hypotheses</text>
</g>
<g transform="translate(657,128)">
  <rect class="ai" x="0" y="0" width="145" height="70" rx="10"/>
  <text class="tag" x="10" y="20" fill="#8b5cf6">Specialist</text>
  <text class="title" x="10" y="40">Operations Advisor</text>
  <text class="label" x="10" y="58">Draft recommendation</text>
</g>
<g transform="translate(810,128)">
  <rect class="ai" x="0" y="0" width="120" height="70" rx="10"/>
  <text class="tag" x="10" y="20" fill="#8b5cf6">Specialist</text>
  <text class="title" x="10" y="40">Briefing</text>
  <text class="label" x="10" y="58">LLM narrates</text>
</g>

<path class="arrow" d="M535 86L92 128" marker-end="url(#arr2)" opacity="0.5"/>
<path class="arrow" d="M535 86L248 128" marker-end="url(#arr2)" opacity="0.5"/>
<path class="arrow" d="M535 86L411 128" marker-end="url(#arr2)" opacity="0.9"/>
<path class="arrow" d="M535 86L574 128" marker-end="url(#arr2)" opacity="0.9"/>
<path class="arrow" d="M535 86L729 128" marker-end="url(#arr2)" opacity="0.5"/>
<path class="arrow" d="M535 86L870 128" marker-end="url(#arr2)" opacity="0.5"/>

<!-- Tool gateway -->
<g transform="translate(20,220)">
  <rect class="gate" x="0" y="0" width="910" height="56" rx="10"/>
  <text class="tag" x="14" y="20" fill="#8b5cf6">Typed Tool Gateway · allowlisted · schema-validated · read-only</text>
  <text class="label" x="14" y="40">kpi.splh · kpi.labor_cost_pct · forecast.labor · anomaly.detail · mcp.labor_rate.get · tms.shipments.list · inbound.labor_plan_check · stores.list</text>
</g>
<path class="arrow" d="M92 198L92 220" marker-end="url(#arr2)"/>
<path class="arrow" d="M248 198L248 220" marker-end="url(#arr2)"/>
<path class="arrow" d="M411 198L411 220" marker-end="url(#arr2)"/>
<path class="arrow" d="M574 198L574 220" marker-end="url(#arr2)"/>
<path class="arrow" d="M729 198L729 220" marker-end="url(#arr2)"/>
<path class="arrow" d="M870 198L870 220" marker-end="url(#arr2)"/>

<!-- Data + MCP -->
<g transform="translate(20,296)">
  <rect class="data" x="0" y="0" width="440" height="50" rx="10"/>
  <text class="title" x="14" y="24">Analytics · Forecast · Anomaly · Inbound plan check</text>
  <text class="label" x="14" y="40">Deterministic · validated datasets only</text>
</g>
<g transform="translate(490,296)">
  <rect class="ai" x="0" y="0" width="440" height="50" rx="10"/>
  <text class="title" x="14" y="24">MCP-style · Labor Rate Reference · TMS inbound shipments</text>
  <text class="label" x="14" y="40">Read-only · versioned · scoped · TMS horizon capped at 5 days</text>
</g>
<path class="arrow" d="M240 276L240 296" marker-end="url(#arr2)"/>
<path class="arrow" d="M710 276L710 296" marker-end="url(#arr2)"/>

<!-- Review + audit -->
<g transform="translate(140,370)">
  <rect class="node" x="0" y="0" width="340" height="44" rx="10"/>
  <text class="title" x="14" y="26">Evidence validation · schema &amp; policy guards</text>
</g>
<g transform="translate(490,370)">
  <rect class="user" x="0" y="0" width="330" height="44" rx="10"/>
  <text class="title" x="14" y="26">Human review (pending_review → approved)</text>
</g>
<path class="arrow" d="M475 346L310 370" marker-end="url(#arr2)"/>
<path class="arrow" d="M475 346L655 370" marker-end="url(#arr2)"/>

<g transform="translate(140,440)">
  <rect class="gate" x="0" y="0" width="680" height="44" rx="10"/>
  <text class="tag" x="14" y="20" fill="#ec4899">Audit event · ai_run row · tool_call rows · approval_event</text>
  <text class="label" x="14" y="38">Append-only. Correlation ID stamps every trace.</text>
</g>
<path class="arrow" d="M310 414L310 440" marker-end="url(#arr2)"/>
<path class="arrow" d="M655 414L655 440" marker-end="url(#arr2)"/>

<text class="label" x="20" y="515">Agents retrieve. Humans decide. Tools describe intent — authorization enforces it.</text>
</svg>
