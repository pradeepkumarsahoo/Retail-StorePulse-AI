<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" role="img" aria-labelledby="t d">
<title id="t">StorePulse-AI system architecture</title>
<desc id="d">A four-layer modular monolith with an isolated AI runtime and a governance control plane. Users on top, presentation and API next, three core pillars (Analytics, AI Orchestration, Governance) in the middle, MCP adapter on the right, data layer underneath, and observability across the bottom.</desc>
<defs>
  <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
    <path d="M0 0L10 5L0 10z" fill="#7b86a3"/>
  </marker>
  <style>
    .bg { fill: #ffffff; }
    .node { fill: #f8fafc; stroke: #cbd5e1; stroke-width: 1; }
    .user { fill: #ecfeff; stroke: #06b6d4; }
    .ai   { fill: #f5f3ff; stroke: #8b5cf6; }
    .data { fill: #fffbeb; stroke: #f59e0b; }
    .gov  { fill: #fdf2f8; stroke: #ec4899; stroke-dasharray: 4 3; }
    .title { font: 600 13px "Inter", system-ui, sans-serif; fill: #0b1220; }
    .label { font: 400 11px "Inter", system-ui, sans-serif; fill: #475569; }
    .tag   { font: 600 9.5px "JetBrains Mono", ui-monospace, monospace; fill: #64748b;
             letter-spacing: 0.1em; text-transform: uppercase; }
    .arrow { stroke: #7b86a3; stroke-width: 1.4; fill: none; opacity: 0.75; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #070914; }
      .node { fill: rgba(255,255,255,0.03); stroke: rgba(255,255,255,0.16); }
      .user { fill: rgba(34,211,238,0.12); stroke: #06b6d4; }
      .ai   { fill: rgba(139,92,246,0.14); stroke: #8b5cf6; }
      .data { fill: rgba(245,158,11,0.12); stroke: #f59e0b; }
      .gov  { fill: rgba(236,72,153,0.08); stroke: #ec4899; }
      .title { fill: #e8ecf5; }
      .label { fill: #b7c0d4; }
      .tag   { fill: #7b86a3; }
      .arrow { stroke: #7b86a3; }
    }
  </style>
</defs>
<rect class="bg" width="960" height="620"/>

<!-- Users -->
<g transform="translate(40,24)">
  <rect class="user" x="0" y="0" width="880" height="56" rx="10"/>
  <text class="tag" x="14" y="20">Users · RBAC + region/store scope</text>
  <text class="label" x="24" y="44">Store Manager</text>
  <text class="label" x="200" y="44">Regional Manager</text>
  <text class="label" x="380" y="44">Workforce Planner</text>
  <text class="label" x="560" y="44">Ops Reviewer</text>
  <text class="label" x="700" y="44">Platform Admin</text>
  <text class="label" x="820" y="44">Auditor</text>
</g>
<path class="arrow" d="M480 82L480 104" marker-end="url(#arr)"/>

<!-- Presentation -->
<g transform="translate(40,108)">
  <rect class="node" x="0" y="0" width="880" height="46" rx="10"/>
  <text class="tag" x="14" y="20">Presentation</text>
  <text class="title" x="14" y="36">Static tiles (M1-M5) · React+Vite from M5 · accessible, responsive</text>
</g>
<path class="arrow" d="M480 154L480 176" marker-end="url(#arr)"/>

<!-- API -->
<g transform="translate(40,180)">
  <rect class="node" x="0" y="0" width="880" height="60" rx="10"/>
  <text class="tag" x="14" y="20">API &amp; Application · FastAPI /api/v1</text>
  <text class="title" x="14" y="38">AuthN · AuthZ · Policy &amp; scope · Query services · Use cases · Rate limits</text>
  <text class="label" x="14" y="54">OpenAPI contracts · structured errors · correlation IDs · demo bearer auth</text>
</g>

<!-- Three pillars -->
<g transform="translate(40,260)">
  <rect class="node" x="0" y="0" width="270" height="130" rx="10"/>
  <text class="tag" x="14" y="20">Core Analytics</text>
  <text class="title" x="14" y="40">KPI service</text>
  <text class="label" x="14" y="58">8 metrics · central catalog · lineage</text>
  <text class="title" x="14" y="82">Forecasting</text>
  <text class="label" x="14" y="98">Seasonal baseline · WAPE/MAE</text>
  <text class="title" x="14" y="118">Anomaly detection (robust z-score)</text>
</g>
<g transform="translate(345,260)">
  <rect class="ai" x="0" y="0" width="270" height="130" rx="10"/>
  <text class="tag" x="14" y="20" fill="#8b5cf6">AI Orchestration · trust boundary</text>
  <text class="title" x="14" y="40">Supervisor</text>
  <text class="label" x="14" y="58">Intent · budgets · timeouts</text>
  <text class="title" x="14" y="82">5 specialist agents</text>
  <text class="label" x="14" y="98">StorePerf · Workforce · AnomalyInv · Advisor · Briefing</text>
  <text class="title" x="14" y="120">Typed tool gateway (per-agent allowlists)</text>
</g>
<g transform="translate(650,260)">
  <rect class="gov" x="0" y="0" width="270" height="130" rx="10"/>
  <text class="tag" x="14" y="20" fill="#ec4899">Governance &amp; audit</text>
  <text class="title" x="14" y="40">Metric &amp; model registry</text>
  <text class="label" x="14" y="58">Prompt version · model version</text>
  <text class="title" x="14" y="82">Approval workflow</text>
  <text class="label" x="14" y="98">pending → approved → in progress</text>
  <text class="title" x="14" y="118">Audit event stream (append-only)</text>
</g>
<path class="arrow" d="M175 240L175 260" marker-end="url(#arr)"/>
<path class="arrow" d="M480 240L480 260" marker-end="url(#arr)"/>
<path class="arrow" d="M785 240L785 260" marker-end="url(#arr)"/>
<path class="arrow" d="M480 390L480 420" marker-end="url(#arr)"/>

<!-- MCP -->
<g transform="translate(650,420)">
  <rect class="ai" x="0" y="0" width="270" height="56" rx="10"/>
  <text class="tag" x="14" y="20" fill="#8b5cf6">External · MCP adapter</text>
  <text class="title" x="14" y="40">Labor Rate Reference server</text>
  <text class="label" x="14" y="54">Read-only · versioned · region-scoped</text>
</g>
<path class="arrow" d="M615 325C680 325 760 390 760 420" marker-end="url(#arr)"/>

<!-- Data layer -->
<g transform="translate(40,420)">
  <rect class="data" x="0" y="0" width="575" height="56" rx="10"/>
  <text class="tag" x="14" y="20" fill="#f59e0b">Data layer</text>
  <text class="title" x="14" y="40">SQLite today · Postgres from M7 · Pandera validation · lineage · quarantine</text>
  <text class="label" x="14" y="54">Deterministic synthetic generator · 30+ stores · integer-cent money</text>
</g>

<!-- Observability -->
<g transform="translate(40,498)">
  <rect class="node" x="0" y="0" width="880" height="48" rx="10"/>
  <text class="tag" x="14" y="20">Observability · structured JSON logs · Prometheus /metrics · correlation IDs</text>
  <text class="label" x="14" y="38">Request/agent/tool traces · cost &amp; latency counters · drift &amp; data-quality dashboards</text>
</g>

<!-- Caption -->
<text class="label" x="40" y="590">Trust boundary: no agent has direct DB or network access; all data access flows through the typed tool gateway.</text>
</svg>
