[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "storepulse-ai"
version = "0.1.0"
description = "StorePulse-AI — governed retail decision intelligence (M1 vertical slice)"
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.4",
  "uvicorn[standard]==0.32.0",
  "pydantic==2.9.2",
  "SQLAlchemy==2.0.35",
  "pandas==2.2.3",
  "pandera==0.20.4",
  "numpy==2.1.2",
  "python-dateutil==2.9.0.post0",
]

[project.optional-dependencies]
dev = [
  "pytest==8.3.3",
  "httpx==0.27.2",
]

[tool.setuptools]
packages = ["packages", "apps", "infrastructure", "scripts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra -q"
